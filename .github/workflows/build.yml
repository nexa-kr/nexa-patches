name: build

on:
  push:
    branches: [main]
    tags: ['*/v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nexa-patches
          key: nexa-patches-${{ hashFiles('patches/*/patch.toml') }}
      - run: python3 tools/build.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: patches/*/build/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${GITHUB_REF_NAME%%/v*}"; ver="${GITHUB_REF_NAME##*/v}"
          want=$(python3 -c "import tomllib; print(tomllib.load(open('patches/$id/patch.toml', 'rb'))['version'])")
          [ "$want" = "$ver" ] || { echo "tag $ver does not match patch.toml version $want"; exit 1; }
          jar=$(ls "jars/$id/build/"*-"$ver".jar)
          (cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
          awk -v v="$ver" '$0 ~ "^## " v "( |$)" {p=1; next} /^## / {p=0} p' "patches/$id/CHANGELOG.md" > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG entry for $ver"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha256" --title "$id $ver" --notes-file notes.md
