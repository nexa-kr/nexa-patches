name: build

on:
  push:
    branches: [main]
    tags: ['*/v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nexa-patches
          key: nexa-patches-${{ hashFiles('patches/*/patch.toml') }}
      - name: build active patches
        run: python3 tools/build.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: patches/*/build/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nexa-patches
          key: nexa-patches-${{ hashFiles('patches/*/patch.toml') }}
      - name: build tagged patch
        id: b
        run: |
          tag="${GITHUB_REF_NAME}"; id="${tag%%/v*}"; ver="${tag##*/v}"
          want=$(python3 -c "import tomllib,sys;print(tomllib.load(open('patches/$id/patch.toml','rb'))['version'])")
          [ "$want" = "$ver" ] || { echo "태그 버전 $ver 과 patch.toml 버전 $want 가 달라요"; exit 1; }
          python3 tools/build.py "$id"
          jar=$(ls patches/$id/build/*.jar)
          (cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" patches/${{ steps.b.outputs.id }}/build/*.jar patches/${{ steps.b.outputs.id }}/build/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes "patches/${{ steps.b.outputs.id }}/patch.toml 참고"
